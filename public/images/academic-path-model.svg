<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">CAN academic path model</title>
<desc id="d">A student moves through a connected academic path supported by courses, learning modes, academic support, and progress tracking.</desc>
<rect width="1200" height="700" rx="36" fill="#F8F6EF"/>
<path d="M150 350 C310 155 450 155 600 350 C750 545 890 545 1050 350" fill="none" stroke="#A9C5D4" stroke-width="18" stroke-linecap="round"/>
<path d="M150 350 C310 155 450 155 600 350 C750 545 890 545 1050 350" fill="none" stroke="#E6C66B" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <g transform="translate(160 350)">
    <circle r="82" fill="#FFF" stroke="#789FB4" stroke-width="4"/>
    <text y="-8" font-size="19" fill="#365D78">STUDENT</text>
    <text y="24" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#102E50">Academic path</text>
  </g>
  <g transform="translate(360 185)">
    <rect x="-125" y="-70" width="250" height="140" rx="24" fill="#FFF" stroke="#C7D8E1" stroke-width="3"/>
    <text y="-20" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#102E50">Courses &amp; pathways</text>
    <text y="18" font-size="17" fill="#496B81">Core subjects, options,</text>
    <text y="43" font-size="17" fill="#496B81">coherent progression</text>
  </g>
  <g transform="translate(570 515)">
    <rect x="-125" y="-70" width="250" height="140" rx="24" fill="#FFF" stroke="#C7D8E1" stroke-width="3"/>
    <text y="-20" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#102E50">How learning works</text>
    <text y="18" font-size="17" fill="#496B81">Live teaching, independent</text>
    <text y="43" font-size="17" fill="#496B81">work, projects, discussion</text>
  </g>
  <g transform="translate(800 185)">
    <rect x="-125" y="-70" width="250" height="140" rx="24" fill="#FFF" stroke="#C7D8E1" stroke-width="3"/>
    <text y="-20" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#102E50">Support</text>
    <text y="18" font-size="17" fill="#496B81">Teachers, coaches, counselors,</text>
    <text y="43" font-size="17" fill="#496B81">local facilitators</text>
  </g>
  <g transform="translate(1030 350)">
    <rect x="-125" y="-70" width="250" height="140" rx="24" fill="#FFF" stroke="#C7D8E1" stroke-width="3"/>
    <text y="-20" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#102E50">Progress &amp; readiness</text>
    <text y="18" font-size="17" fill="#496B81">Assessment, grades, records,</text>
    <text y="43" font-size="17" fill="#496B81">preparation for what is next</text>
  </g>
</g>
<text x="600" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#102E50">One academic path. Connected support.</text>
</svg>