<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d">
<title id="t">CAN partnership model</title>
<desc id="d">Community contribution and CAN shared capabilities combine while local identity remains local, producing a local CAN school experience.</desc>
<rect width="1200" height="690" rx="36" fill="#F8F6EF"/>
<text x="600" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#102E50">A partnership, not a handoff.</text>
<g>
  <rect x="65" y="125" width="310" height="260" rx="28" fill="#EDF3ED" stroke="#AFC4B2" stroke-width="3"/>
  <text x="220" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4F7756">COMMUNITY BRINGS</text>
  <text x="105" y="225" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#102E50">Local relationships</text>
  <text x="105" y="265" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Leadership</text>
  <text x="105" y="298" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Facilities &amp; local support</text>
  <text x="105" y="331" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Knowledge of families</text>

  <rect x="445" y="125" width="310" height="260" rx="28" fill="#E8F1F5" stroke="#A8C2D1" stroke-width="3"/>
  <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#315F7A">CAN PROVIDES</text>
  <text x="485" y="225" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#102E50">Shared capabilities</text>
  <text x="485" y="265" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Academic model</text>
  <text x="485" y="298" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Teachers &amp; support</text>
  <text x="485" y="331" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Operating systems</text>

  <rect x="825" y="125" width="310" height="260" rx="28" fill="#FAF1D8" stroke="#D9BB67" stroke-width="3"/>
  <text x="980" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8A6B25">WHAT STAYS LOCAL</text>
  <text x="865" y="225" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#102E50">Identity &amp; leadership</text>
  <text x="865" y="265" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Ministry / culture</text>
  <text x="865" y="298" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Community relationships</text>
  <text x="865" y="331" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Local expression</text>
</g>
<g stroke="#668CA3" stroke-width="5" fill="none">
  <path d="M220 385 C260 440 380 455 480 490"/>
  <path d="M600 385 L600 475"/>
  <path d="M980 385 C940 440 820 455 720 490"/>
</g>
<rect x="285" y="470" width="630" height="135" rx="30" fill="#FFF" stroke="#668CA3" stroke-width="4"/>
<text x="600" y="520" text-anchor="middle" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#102E50">Local CAN school experience</text>
<text x="600" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#496B81">Shared foundation. Distinct community. Clear roles.</text>
</svg>