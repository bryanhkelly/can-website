<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>CAN Academy form definitions</title></head>
<body>
  <!-- Netlify parses this static HTML at deploy time. The COGIC inquiry is rendered by React. -->
  <form name="cogic-founding-partner" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="cogic-founding-partner" />
    <input type="text" name="partner" />
    <input type="text" name="proposal" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="role" />
    <input type="text" name="organization" />
    <select name="interest"><option>National educational partnership</option></select>
    <select name="sites"><option>Not yet determined</option></select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
